# hubx/micro_apps docker 底座（六件套：mysql / kafka / consul / nacos / redis / jaeger）
#
# 事实来源：docs/superpowers/plans/local-docker-env.md（本机华为云镜像 + 端口裁决，以此为准）
#   - 镜像全部走华为云前缀 swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/<image>
#   - Kafka 用 bitnami KRaft 单节点（无 zookeeper 容器），宿主映射 19093→9092
#     （宿主 9092/19092 被既有容器占用）；KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
#     自动建 topic（order.completed.v1 / coupon.exchanged.v1 / points.granted.v1 及各自 .dlq）
#   - MySQL/Consul/Nacos/Redis/Jaeger 直接用宿主默认端口 3306/8500+8600/8848/6379/4317+16686
#   - 宿主已在跑 hubx-logx-* 等容器（勿 kill），端口以裁决表为准
#   - 不挂命名数据卷：`docker compose down` 后重 `up` 会重跑 init.sql，保证从零可复跑
#
# 起停：docker compose -f docker/compose.yaml up -d
#       （compose 以文件所在目录解析相对挂载路径，init.sql 挂 ./mysql/init.sql）

name: hubx-micro-apps

services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0
    container_name: hubx-ma-mysql
    restart: unless-stopped
    mem_limit: 640m
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 五库五账号 + 全量表（init.sql 与 pkg/seedsql 五份 DDL 同步维护）
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [hubx-ma]

  kafka:
    # bitnami KRaft 单节点（KRaft 模式：无 zookeeper 依赖）
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/kafka:3.9.0
    container_name: hubx-ma-kafka
    restart: unless-stopped
    mem_limit: 896m
    ports:
      # 宿主 19093 → 容器 9092；客户端（宿主 go run 起的服务）统一连 127.0.0.1:19093
      - "19093:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
      # INTERNAL 供容器内健康检查用（健康检查客户端会跟随 metadata 里的
      # advertised 地址，直接打 9092 会被广告到宿主侧 19093 而连不上）
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,PLAINTEXT://:9092,CONTROLLER://:9093
      # 广告地址必须写宿主侧映射端口：服务跑在宿主（go run），经 127.0.0.1:19093 访问
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://127.0.0.1:29092,PLAINTEXT://127.0.0.1:19093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 单节点：三个内部 topic 的副本数都压到 1，否则建不出来
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # 内存吃紧的开发机：堆压到 384m（宿主还有其他项目容器在跑）
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [hubx-ma]

  consul:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/hashicorp/consul:1.22.4
    container_name: hubx-ma-consul
    restart: unless-stopped
    mem_limit: 256m
    command:
      [
        "agent",
        "-dev",
        "-client=0.0.0.0",
      ]
    ports:
      - "8500:8500" # http api
      - "8600:8600/tcp" # dns
      - "8600:8600/udp" # dns
    healthcheck:
      test: ["CMD-SHELL", "consul members 2>/dev/null | grep -q 'alive' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [hubx-ma]

  nacos:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v2.4.2
    container_name: hubx-ma-nacos
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # 单机 standalone + 内置 derby 存储。
      # 注意：不要设置 SPRING_DATASOURCE_PLATFORM——Spring 松散绑定会把它绑到
      # spring.datasource.platform，非空即走 db.url.0（MySQL）而 derby 失效。
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 384m
    ports:
      - "8848:8848"
      - "9848:9848" # 客户端 gRPC 长轮询
    healthcheck:
      # show=all 的检索接口在配置为空时也返回 200，可作就绪探针
      test:
        - "CMD-SHELL"
        - 'curl -sf "http://127.0.0.1:8848/nacos/v1/cs/configs?dataId=nacos&group=public&show=all" >/dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [hubx-ma]

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7
    container_name: hubx-ma-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [hubx-ma]

  jaeger:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/jaegertracing/all-in-one:1.63.0
    container_name: hubx-ma-jaeger
    restart: unless-stopped
    mem_limit: 384m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_GRPC_PORT: "4317"
      COLLECTOR_OTLP_HTTP_PORT: "4318"
    ports:
      - "4317:4317" # OTLP gRPC（otelx 导出端点 127.0.0.1:4317）
      - "4318:4318" # OTLP HTTP
      - "16686:16686" # Jaeger UI
    healthcheck:
      # 镜像内有 busybox wget；14269 是 jaeger admin 端口，就绪后返回 200
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [hubx-ma]

networks:
  hubx-ma:
    driver: bridge

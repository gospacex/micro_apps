# srv-product 本地配置（Nacos 远程 dataId=hubx.trace / group=HUBX 覆盖 trace 段；本地字段兜底）
#
# 装配（11 服务同构，顺序为硬约束）：
#   1. configx.New（Nacos hubx.trace + 本文件兜底，本地字段优先）
#   2. rpcx/configx.MustLoad（kitex.*/log.*）+ rpcx/tracing.Init（OTLP gRPC 4317）
#   3. dbx/cachex/mqx（经官方 loader，Trace.On(kind) 门控）+ Consul 注册
#   4. kitex server（9002）+ webx 健康探针
#   5. 优雅退出反序 + OTel flush
app:
  name: srv-product

configx:
  remote:
    enabled: true
    provider: nacos
    nacos:
      server_configs:
        - ip: 127.0.0.1
          port: 8848
      namespace_id: public
      group: HUBX
      data_id: hubx.trace
      refresh_interval: 30s

logx:
  level: info
  format: console
  output: stdout
  service_name: srv-product

# rpcx 栈配置键（kitex.*/log.*；rpcx/tracing.Init 读 log.enable_trace）
log:
  enable_trace: true
  trace:
    endpoint: 127.0.0.1:4317
    insecure: true

kitex:
  server:
    service_name: srv-product
    addr: 0.0.0.0:9002
    transport: pingpong
    write_timeout_ms: 5000
    read_timeout_ms: 5000
    max_conns: 10000
    max_qps: 0

xmiddleware:
# ----- sqlx（product_db：product_rw 账号私有库）-----
  sqlx:
    driver: mysql
    databases:
      default:
        driver: mysql
        dsn: "product_rw:hubx123@tcp(127.0.0.1:3306)/product_db?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 20
        max_idle_conns: 5
        conn_max_lifetime: 5m
        conn_max_idle_time: 3m
        slow_threshold: 200ms
        enable_log: true
        log_level: warn
        enable_trace: true

  # ----- cachex（product:hot:，TTL 30s）-----
  cachex:
    driver: redis
    instances:
      default:
        addr: 127.0.0.1:6379
        password: ""
        db: 0
        pool_size: 100
        min_idle_conns: 10
        dial_timeout: 5s
        read_timeout: 3s
        write_timeout: 3s
        max_retries: 3
        slow_threshold: 100ms
        enable_trace: true
        prefix: "product:hot:"
        ttl: 30s

  # ----- mqx（kafka，宿主映射 19093；consumer group 定死 srv-product-v1）-----
  mqx:
    driver: kafka
    instances:
      default:
        brokers:
          - "127.0.0.1:19093"
        call_chain_enabled: true
        call_chain_exporter: ""
        enable_trace: true
        producer:
          topic: ""
          batch_size: 100
          batch_timeout: 10ms
          max_retries: 3
          required_acks: all
          compression: none
        consumer:
          group_id: srv-product-v1
          topics: [] # 不消费事件（事件消费在 job）
          auto_commit: true
          max_concurrency: 4
          session_timeout: 30s
          heartbeat_interval: 10s

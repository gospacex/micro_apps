# ============================================================
# gateway 服务配置 —— xmiddleware 段（字段名对齐 configx 企业契约
# configx/configs/config.enterprise.yaml，与 monolith 契约逐字一致）
#
# 灌入 Nacos：dataId hubx.gateway，group HUBX（configs/seed-nacos.sh）
# 地址一律宿主侧值（服务不进 compose，go run 跑在宿主上；端口裁决见
# docs/superpowers/plans/local-docker-env.md）：
#   MySQL 127.0.0.1:3306 / Kafka 127.0.0.1:19093 / Redis 127.0.0.1:6379
# 实例名 = 服务可部署单元名（<self>）：xmiddleware.{sqlx,cachex,mqx}.*.gateway
# 密码走 env 占位：运行前 export HUBX_DB_PW=<与 docker/mysql/init.sql 一致>
# （本地演示密码 hubx123）
# 网关零业务、无 DB（不做 xmiddleware.sqlx）；只挂限流计数器缓存。
# 不生产/消费事件（无 xmiddleware.mqx）。
# ============================================================

xmiddleware:

  # ----- cachex：Redis（缓存/限流计数器/防重锁共用同一 Cache 接口）-----
  cachex:
    driver: redis
    instances:
      gateway:
        addr: 127.0.0.1:6379
        password: ""
        db: 0
        pool_size: 100
        min_idle_conns: 10
        pool_timeout: 30s
        idle_timeout: 5m
        dial_timeout: 5s
        read_timeout: 3s
        write_timeout: 3s
        max_retries: 3
        slow_threshold: 100ms
        enable_trace: true

# gateway 本地配置（Nacos 远程 dataId=hubx.trace / group=HUBX 覆盖 trace 段；本地字段兜底）
#
# 装配（11 服务同构）：
#   1. configx.New（Nacos hubx.trace + 本文件兜底）→ 2. rpcx/configx.MustLoad（kitex.*/log.*）
#   → 3. dbx/cachex/mqx（本服务无 DB；仅 cachex 限流 + Consul）→ 4. webx（8080，根 span 诞生地）
#
# gateway 无 DB：infra 只装缓存（rl:{ip}:{route} 限流计数器）+ 限流，无 mqx 生产/消费角色。
app:
  name: gateway
  addr: 0.0.0.0:8080 # webx 监听（HTTP 入口，根 span 诞生）

configx:
  remote:
    enabled: true
    provider: nacos
    nacos:
      server_configs:
        - ip: 127.0.0.1
          port: 8848
      namespace_id: public
      group: HUBX
      data_id: hubx.trace
      refresh_interval: 30s

logx:
  level: info
  format: console
  output: stdout
  service_name: gateway

# rpcx 栈配置键（kitex.*/log.*；rpcx/tracing.Init 读 log.enable_trace + OTLP gRPC 4317）
log:
  enable_trace: true
  trace:
    endpoint: 127.0.0.1:4317
    insecure: true

kitex:
  client:
    service_name: gateway
    # target 运行时由 Consul resolver（hubx/svc/<serviceID> KV）拼装，不在配置里写死

xmiddleware:
  # ----- cachex（限流计数器 rl:{ip}:{route}，Set NX EX 语义 + 应用层判断）-----
  cachex:
    driver: redis
    instances:
      default:
        addr: 127.0.0.1:6379
        password: ""
        db: 0
        pool_size: 100
        min_idle_conns: 10
        dial_timeout: 5s
        read_timeout: 3s
        write_timeout: 3s
        max_retries: 3
        slow_threshold: 100ms
        enable_trace: true
        prefix: "rl:"
        ttl: 60s

  # ----- mqx（gateway 无生产/消费角色；实例保留 + group 定死供后续扩展）-----
  mqx:
    driver: kafka
    instances:
      default:
        brokers:
          - "127.0.0.1:19093"
        call_chain_enabled: true
        call_chain_exporter: ""
        enable_trace: true
        producer:
          topic: ""
          batch_size: 100
          batch_timeout: 10ms
          max_retries: 3
          required_acks: all
          compression: none
        consumer:
          group_id: gateway-v1
          topics: [] # gateway 不消费事件（事件消费在 job）
          auto_commit: true
          max_concurrency: 4
          session_timeout: 30s
          heartbeat_interval: 10s

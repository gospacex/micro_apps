# ============================================================
# hubx/micro_apps 统一调用链开关（configs/trace.yaml）
#
# Nacos 单一 dataId（hubx.trace / HUBX），11 服务共读；
# seed-nacos.sh 发布，矩阵验收程序化改写本文件触发 7 组合。
#
# 字段与 monolith config.yaml 的 trace 段对齐。
# 裁决规则（矩阵要证的三点）：
#   1. 生效值 = trace.enabled ∧ trace.<kind> ∧ 官方段 enable_trace
#   2. 总闸 enabled=false 比中间件管得宽：分层 span 一起灭，全服务归零
#   3. 省略细分键 → 该 kind 取官方段（sqlx/cachex/mqx）值
# ============================================================
trace:
  enabled: true
  exporter: otlp # otlp | stdout | jaeger
  endpoint: 127.0.0.1:4317 # Jaeger OTLP gRPC（宿主映射 4317，见 local-docker-env.md）
  sample_ratio: 1
  db: true # SQL（单表 CRUD / 多表事务 / 连表 JOIN）
  cache: true # 缓存命令（GET / SET / DEL …）
  mq: true # 消息生产（send）与消费（process）

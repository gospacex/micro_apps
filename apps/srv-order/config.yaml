# ============================================================
# srv-order 服务配置 —— xmiddleware 段（字段名对齐 configx 企业契约
# configx/configs/config.enterprise.yaml，与 monolith 契约逐字一致）
#
# 灌入 Nacos：dataId hubx.srv-order，group HUBX（configs/seed-nacos.sh）
# 地址一律宿主侧值（服务不进 compose，go run 跑在宿主上；端口裁决见
# docs/superpowers/plans/local-docker-env.md）：
#   MySQL 127.0.0.1:3306 / Kafka 127.0.0.1:19093 / Redis 127.0.0.1:6379
# 实例名 = 服务可部署单元名（<self>）：xmiddleware.{sqlx,cachex,mqx}.*.srv-order
# 密码走 env 占位：运行前 export HUBX_DB_PW=<与 docker/mysql/init.sql 一致>
# （本地演示密码 hubx123）
# 私有库 order_db（账号 order_rw）。
# 生产事件 order.completed.v1（outbox 事务发件箱 + 3s 轮询补发）。
# ============================================================

xmiddleware:

  # ----- sqlx：本服务私有库（一库一 srv 一账号，禁跨库 JOIN/直连他人库）-----
  sqlx:
    driver: gorm
    databases:
      srv-order:
        dsn: "order_rw:${HUBX_DB_PW}@tcp(127.0.0.1:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 20
        max_idle_conns: 5
        conn_max_lifetime: 5m
        conn_max_idle_time: 3m
        slow_threshold: 200ms
        enable_log: true
        log_level: warn
        # 官方调用链字段；生效值仍受统一 trace 段三段正交裁决
        enable_trace: true
        health_check:
          enabled: true
          interval: 30s
          timeout: 5s

  # ----- cachex：Redis（缓存/限流计数器/防重锁共用同一 Cache 接口）-----
  cachex:
    driver: redis
    instances:
      srv-order:
        addr: 127.0.0.1:6379
        password: ""
        db: 0
        pool_size: 100
        min_idle_conns: 10
        pool_timeout: 30s
        idle_timeout: 5m
        dial_timeout: 5s
        read_timeout: 3s
        write_timeout: 3s
        max_retries: 3
        slow_threshold: 100ms
        enable_trace: true

  # ----- mqx：Kafka 生产者（order.completed.v1 发布（outbox 补发））-----
  mqx:
    driver: kafka
    instances:
      srv-order:
        brokers:
          - "127.0.0.1:19093"
        call_chain_enabled: true
        enable_trace: true
        producer:
          topic: order.completed.v1
          # 事件体见 pkg/events（order.completed，带 SchemaVer）
          batch_size: 100
          batch_timeout: 10ms
          max_retries: 3
          retry_backoff: 100ms
          # acks=all：Sarama RequiredAcks -1 = WaitForAll
          #（企业契约样例写 "all"，mqx loader 用 GetInt 读取，须写 -1 才等全量 ack）
          required_acks: -1
          compression: none
